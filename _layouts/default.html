<!DOCTYPE html>
<html lang="{{ site.lang | default: 'it' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Content-Security-Policy: limita script, stili e font ai soli file del
     sito stesso. Nessuna risorsa esterna (font inclusi, ospitati in
     /assets/fonts) e nessuno script inline: script-src 'self' senza
     'unsafe-inline'. I dati strutturati JSON-LD non sono eseguibili e non
     rientrano in script-src. style-src mantiene 'unsafe-inline' perche' il
     sito usa attributi style="..." nei template. Non copre /admin (Sveltia
     CMS ha bisogno di connettersi liberamente a GitHub e a unpkg.com).
     Limite noto: GitHub Pages non supporta header HTTP personalizzati,
     quindi qui manca X-Frame-Options/frame-ancestors (il tag <meta> non
     puo' impostarlo) e HSTS va servito dalla piattaforma stessa.
     Se in futuro il form di prenotazione viene collegato a un servizio
     esterno (Web3forms, Formspree, ecc.), aggiungere il suo dominio a
     connect-src e/o form-action qui sotto, altrimenti l'invio verra'
     bloccato silenziosamente dal browser. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests">

<!-- jekyll-seo-tag genera automaticamente: title, meta description,
     canonical, Open Graph, Twitter Card — l'equivalente di Yoast,
     leggendo title/description dal front matter di ogni pagina. -->
{% seo %}

{% if page.structured_data %}
<script type="application/ld+json">
{{ page.structured_data | jsonify }}
</script>
{% endif %}

<link rel="icon" href="{{ '/assets/img/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon-32.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">

<link rel="preload" href="{{ '/assets/fonts/fraunces-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/karla-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
{% include header.html %}
<main id="top">
{{ content }}
</main>
{% include footer.html %}
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
