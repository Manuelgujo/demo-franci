{%- comment -%}
  Icone dei servizi. Uso: {% assign icon_name = "heart" %}{% include icon.html %}
  Per aggiungerne una: nuovo blocco "when" qui sotto + voce nell'elenco "icon" di admin/config.yml.
  Stile comune: viewBox 24x24, tratto 1.6, nessun riempimento.
{%- endcomment -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
