# ============================================================
# Configurazione di Sveltia CMS.
# IMPORTANTE prima di andare online:
# - sostituisci "TUO-USERNAME/TUO-REPO" con il nome reale
#   del tuo repository GitHub (es. francescapirazzo/sito-web)
# - se il branch principale del repo si chiama "master" invece
#   di "main", cambia anche quello qui sotto
# ============================================================

backend:
  name: github
  repo: Manuelgujo/demo-franci
  branch: main
  # Nessun OAuth backend necessario: Francesca farà login con un
  # Personal Access Token di GitHub (vedi README per come generarlo).

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  - name: "categories"
    label: "Categorie"
    label_singular: "Categoria"
    folder: "_categories"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: "Nome categoria", name: "title", widget: "string", required: true }
      - { label: "Slug", name: "slug", widget: "string", required: true, hint: "URL amichevole, es. ansia-e-stress (senza spazi, solo lettere, numeri e trattini)" }

  - name: "blog"
    label: "Articoli del blog"
    label_singular: "Articolo"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Data di pubblicazione", name: "date", widget: "datetime" }
      - label: "Categorie"
        name: "categories"
        widget: "relation"
        collection: "categories"
        search_fields: ["title"]
        display_fields: ["title"]
        value_field: "title"
        multiple: true
        required: false
      - label: "Anteprima breve"
        name: "excerpt"
        widget: "text"
        hint: "Il testo che appare nella card del blog e nei risultati di ricerca Google. 1-2 frasi."
      - label: "Meta description SEO (opzionale)"
        name: "description"
        widget: "text"
        required: false
        hint: "Se lasci vuoto, verrà usata l'anteprima breve."
      - { label: "Contenuto dell'articolo", name: "body", widget: "markdown" }
