plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# URL puliti per gli articoli: /blog/nome-articolo/
# invece del default di Jekyll /anno/mese/giorno/nome-articolo.html
permalink: /blog/:title/

collections:
  servizi:
    output: true
    permalink: /servizi/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "servizi"
    values:
      layout: "servizio"
      seo:
        type: "WebPage"
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
